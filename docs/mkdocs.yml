site_name: Gorgoglio
site_url: https://gorgoglio.it/docs
docs_dir: content

nav:
  - Home: index.md
  - Introduzione:
    - Cos'è l'idroponica: intro/hydroponic.md
    - Sicurezza: intro/safety.md
  - Orto in cassetta:
    - Panoramica: orto_in_cassetta/overview.md
    - Componenti: orto_in_cassetta/components.md
    - Costruzione: orto_in_cassetta/build.md
    - Coltivazione: orto_in_cassetta/cultivation.md
  - Articoli:
    - Misurare il pH: articles/ph.md
  - Contribuisci: contribute.md
  - Licenza: license.md


theme:
  name: material
  palette:
    # Colori principali
    primary: 'green'   # Verde (Primario)
    accent:  'orange'   # Blu (Secondario)

  icon:
    logo: material/sprout 

  # Font
  font:
    text: Roboto
    code: monospace # Font predefinito per il codice va bene di solito

  # Funzionalità aggiuntive (alcune sono abilitate di default)
  features:
    - search # Abilita la ricerca
    - content.code.copy # Aggiunge un pulsante per copiare il codice


extra_css:
  - assets/css/cards.css

plugins:
  - search
  - redirects:
      redirect_maps:
        solutions/overview.md: orto_in_cassetta/overview.md
        solutions/orto_in_cassetta/overview.md: orto_in_cassetta/overview.md
        solutions/orto_in_cassetta/components.md: orto_in_cassetta/components.md
        solutions/orto_in_cassetta/build.md: orto_in_cassetta/build.md
        solutions/orto_in_cassetta/cultivation.md: orto_in_cassetta/cultivation.md

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.blocks.caption